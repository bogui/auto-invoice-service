name: Version Control

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  commit-message-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          git log --format=%B ${{ github.event.before }}..${{ github.sha }} | while read -r msg; do
            if ! echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z-]+\))?: .+$"; then
              echo "Error: Commit message does not follow conventional commit format:"
              echo "$msg"
              exit 1
            fi
          done

  version-check:
    needs: commit-message-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CHANGELOG.md
        run: |
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md is missing [Unreleased] section"
            exit 1
          fi

      - name: Check version format
        run: |
          if ! grep -qE "## \[[0-9]+\.[0-9]+\.[0-9]+\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md is missing proper version format"
            exit 1
          fi

      - name: Check for version bump
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          if ! git diff --name-only origin/main | grep -q "CHANGELOG.md"; then
            echo "Warning: CHANGELOG.md has not been updated"
          fi

  release:
    needs: [commit-message-check, version-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Update Release Notes
        run: |
          # Extract changes from CHANGELOG.md
          CHANGES=$(sed -n '/## \[Unreleased\]/,/## \[/p' CHANGELOG.md | grep -v '^##')

          # Update release description
          gh release edit v${{ github.run_number }} --notes "$CHANGES"
