name: Version Control

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Add permissions block
permissions:
  contents: write
  pull-requests: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check CHANGELOG.md
        run: |
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md is missing [Unreleased] section"
            exit 1
          fi

      - name: Check version format
        run: |
          if ! grep -qE "## \[[0-9]+\.[0-9]+\.[0-9]+\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md is missing proper version format"
            exit 1
          fi

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check version against latest tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION="v${{ steps.current_version.outputs.version }}"

          if [ "$(printf '%s\n' "$LATEST_TAG" "$CURRENT_VERSION" | sort -V | tail -n1)" != "$CURRENT_VERSION" ]; then
            echo "Error: New version ($CURRENT_VERSION) is not greater than latest tag ($LATEST_TAG)"
            exit 1
          fi

      - name: Check for version bump
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          if ! git diff --name-only origin/main | grep -q "CHANGELOG.md"; then
            echo "Warning: CHANGELOG.md has not been updated"
          fi

  release:
    needs: version-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from CHANGELOG
        id: get_version
        run: |
          VERSION=$(grep -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for existing release
        run: |
          if gh release view "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "Error: Release v${{ steps.get_version.outputs.version }} already exists"
            exit 1
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            $(sed -n '/## \[Unreleased\]/,/## \[/p' CHANGELOG.md | grep -v '^##')
          fail_on_unmatched_files: true
          generate_release_notes: true
